
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LotReady | Reset Password</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e1720;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      box-sizing: border-box;
      width: min(90%, 400px);
      padding: 30px;
      background: #192838;
      border-radius: 16px;
    }
    h1 { margin-bottom: 8px; }
    p { color: #cbd5e1; line-height: 1.5; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #64748b; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #message { margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>LotReady</h1>
    <p>Create your new password.</p>

    <form id="resetForm">
      <input
        id="password"
        type="password"
        placeholder="New password (8+ characters)"
        minlength="8"
        autocomplete="new-password"
        required
      />
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        minlength="8"
        autocomplete="new-password"
        required
      />
      <button id="submitButton" type="submit" disabled>
        Checking recovery link...
      </button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const supabaseUrl =
      'https://aytnrvodccwqfcwautnn.supabase.co';

    // Replace this text with your Supabase PUBLISHABLE key.
    const supabaseKey =sb_publishable_FWlVMl8_qGQzgNKOREUa3Q_KX4gWsY8

    const supabase = createClient(supabaseUrl, supabaseKey, {
      auth: {
        detectSessionInUrl: false,
        persistSession: false,
        autoRefreshToken: false
      }
    });

    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    function showMessage(text) {
      message.textContent = text;
    }

    async function initializeRecovery() {
      try {
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.slice(1));

        const errorDescription =
          query.get('error_description') ||
          hash.get('error_description');

        if (errorDescription) {
          throw new Error(errorDescription);
        }

        const tokenHash = query.get('token_hash');
        const code = query.get('code');

        if (tokenHash && query.get('type') === 'recovery') {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
          });
          if (error) throw error;
        } else if (code) {
          const { error } =
            await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        } else if (
          hash.get('type') === 'recovery' &&
          hash.get('access_token') &&
          hash.get('refresh_token')
        ) {
          const { error } = await supabase.auth.setSession({
            access_token: hash.get('access_token'),
            refresh_token: hash.get('refresh_token')
          });
          if (error) throw error;
        } else {
          throw new Error('Open the password-reset link from your email.');
        }

        // Remove recovery credentials from the browser address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        button.disabled = false;
        button.textContent = 'Update Password';
        showMessage('Recovery verified. Enter your new password.');
      } catch (error) {
        button.textContent = 'Invalid Recovery Link';
        showMessage(error.message || 'Recovery link is invalid or expired.');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmation =
        document.getElementById('confirmPassword').value;

      if (password !== confirmation) {
        showMessage('Passwords do not match.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        showMessage(error.message);
        button.disabled = false;
        button.textContent = 'Update Password';
        return;
      }

      showMessage(
        'Password updated successfully! Return to LotReady and sign in.'
      );
      form.reset();
      button.textContent = 'Password Updated';
      await supabase.auth.signOut();
    });

    initializeRecovery();
  </script>
</body>
</html>
